apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devtest
  template:
    metadata:
      labels:
        app: devtest
    spec:
      containers:
      - name: devtest
        image: hashicorp/http-echo:1.0.0
        imagePullPolicy: IfNotPresent
        args:
          - "-text=devtest running in k3s"
        ports:
        - containerPort: 5678
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          tcpSocket:
            port: 5678
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5678
          initialDelaySeconds: 5
          periodSeconds: 5